name: ci

on:
  push:
    branches: [main]
  # release-please opens its release PR with GITHUB_TOKEN, which creates a
  # pull_request run that can only sit in action_required. Its output set is
  # exactly these files, so excluding them means no run is ever created.
  pull_request:
    branches: [main]
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
      - package-lock.json

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert release-please PR CI exclusions
        run: bash scripts/check-release-ci-exclusions.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
